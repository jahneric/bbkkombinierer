<!doctype html><meta charset="utf-8"><body><script>
// removes the print from a white t-shirt photo and returns a grey shading map (white fabric = light) with alpha.

      for (let y = 0; y < size; y++) { a[y * size + xx] = s2 / (2 * r + 1); s2 += t[Math.min(size - 1, y + r + 1) * size + xx] - t[Math.max(0, y - r) * size + xx]; } } }

// push-pull hole filling: average known pixels down a pyramid, fill from coarse to fine (bilinear), then blur the result

      for (let xx = 0; xx < size; xx++) { t[y * size + xx] = s2 / (2 * r + 1); s2 += a[y * size + Math.min(size - 1, xx + r + 1)] - a[y * size + Math.max(0, xx - r)]; } }
    for (let xx = 0; xx < size; xx++) { let s2 = 0; for (let y = -r; y <= r; y++) s2 += t[Math.min(size - 1, Math.max(0, y)) * size + xx];
      for (let y = 0; y < size; y++) { a[y * size + xx] = s2 / (2 * r + 1); s2 += t[Math.min(size - 1, y + r + 1) * size + xx] - t[Math.max(0, y - r) * size + xx]; } } }

window.clean = async (src, size) => {

    const sat = Math.max(r, g, b) - Math.min(r, g, b); hole[i] = A[i] > 200 && (sat > 14 || L[i] < 150) ? 1 : 0; }
  // only treat the chest area as print (keeps collar / seams / edge shadows), then grow the mask to cover soft edges

  const grow = (m, r) => { const o = new Uint8Array(n); for (let y = 0; y < size; y++) for (let xx = 0; xx < size; xx++) { if (!m[y * size + xx]) continue;
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) { const yy = y + dy, x2 = xx + dx; if (yy >= 0 && yy < size && x2 >= 0 && x2 < size && dx * dx + dy * dy <= r * r) o[yy * size + x2] = 1; } } return o; };

  let lv = [{ w: size, v: Float32Array.from(L), k: Float32Array.from(H, (h, i) => h || A[i] < 250 ? 0 : 1) }];
  while (lv[lv.length - 1].w > 4) { const { w, v, k } = lv[lv.length - 1], w2 = w >> 1, v2 = new Float32Array(w2 * w2), k2 = new Float32Array(w2 * w2);
    for (let y = 0; y < w2; y++) for (let xx = 0; xx < w2; xx++) { let sv = 0, sk = 0; for (const [a, b] of [[0, 0], [1, 0], [0, 1], [1, 1]]) { const j = (y * 2 + b) * w + xx * 2 + a; sv += v[j] * k[j]; sk += k[j]; }
      const j2 = y * w2 + xx; k2[j2] = Math.min(1, sk); v2[j2] = sk ? sv / sk : 0; }
    lv.push({ w: w2, v: v2, k: k2 }); }
  for (let l = lv.length - 2; l >= 0; l--) { const { w, v, k } = lv[l], up = lv[l + 1];
    const bil = (fx, fy) => { fx = Math.max(0, Math.min(up.w - 1.001, fx)); fy = Math.max(0, Math.min(up.w - 1.001, fy)); const x0 = fx | 0, y0 = fy | 0, tx = fx - x0, ty = fy - y0, W2 = up.w;
      const a = up.v[y0 * W2 + x0], b = up.v[y0 * W2 + Math.min(W2 - 1, x0 + 1)], c2 = up.v[Math.min(W2 - 1, y0 + 1) * W2 + x0], d2 = up.v[Math.min(W2 - 1, y0 + 1) * W2 + Math.min(W2 - 1, x0 + 1)];
      return (a * (1 - tx) + b * tx) * (1 - ty) + (c2 * (1 - tx) + d2 * tx) * ty; };
    for (let y = 0; y < w; y++) for (let xx = 0; xx < w; xx++) { const j = y * w + xx, uv = bil((xx + .5) / 2 - .5, (y + .5) / 2 - .5); v[j] = v[j] * k[j] + uv * (1 - k[j]); } }

  const blur = (src, r) => { let a = Float32Array.from(src), t = new Float32Array(n);
    for (let pass = 0; pass < 3; pass++) {
      for (let y = 0; y < size; y++) { let s2 = 0; for (let xx = -r; xx <= r; xx++) s2 += a[y * size + Math.min(size - 1, Math.max(0, xx))];
        for (let xx = 0; xx < size; xx++) { t[y * size + xx] = s2 / (2 * r + 1); s2 += a[y * size + Math.min(size - 1, xx + r + 1)] - a[y * size + Math.max(0, xx - r)]; } }
      for (let xx = 0; xx < size; xx++) { let s2 = 0; for (let y = -r; y <= r; y++) s2 += t[Math.min(size - 1, Math.max(0, y)) * size + xx];
        for (let y = 0; y < size; y++) { a[y * size + xx] = s2 / (2 * r + 1); s2 += t[Math.min(size - 1, y + r + 1) * size + xx] - t[Math.max(0, y - r) * size + xx]; } } }
